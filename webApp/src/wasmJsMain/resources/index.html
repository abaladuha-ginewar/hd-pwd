<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="application-version" content="@@APP_VERSION@@">
    <title>哈密</title>
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        html, body, #ComposeTarget {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .hdpwd-html-input {
            position: fixed;
            z-index: 20;
            box-sizing: border-box;
            margin: 0;
            border: 1px solid #79747e;
            border-radius: 4px;
            padding: 12px 16px;
            font-size: 16px;
            line-height: 1.4;
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
            background: #fff;
            color: #1c1b1f;
            outline: none;
        }
        .hdpwd-html-input:focus {
            border-color: #6750a4;
            border-width: 2px;
            padding: 11px 15px;
        }
        .hdpwd-html-input:disabled {
            background: #f5f5f5;
            color: #9e9e9e;
        }
        .hdpwd-html-input-error {
            border-color: #b3261e;
        }
    </style>
</head>
<body>
<div id="ComposeTarget"></div>
<script src="webApp.js"></script>
</body>
</html>
